[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdm-climate-niche"
version = "0.2.0"
description = "Species Distribution Modeling & Bioclimatic Envelope Forecasting for Acer saccharum"
readme = "project_planning.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "geopandas>=1.0",
    "pyogrio>=0.10",
    "pyproj>=3.6",
    "shapely>=2.0",
    "rasterio>=1.4",
    "rioxarray>=0.17",
    "xarray>=2024.1",
    "pyarrow>=15.0",
    "pygbif>=0.7.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "lightgbm>=4.1",
    "elapid>=0.3.2",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "streamlit>=1.32",
    "leafmap>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3.0",
    "black>=24.1",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py312"]
